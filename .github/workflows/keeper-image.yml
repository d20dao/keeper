name: Keeper image publish
on:
  push:
    branches: [main]
    paths: ['keeper/**', 'deploy/docker/**', '.dockerignore', 'scripts/keeper-docker-smoke.mjs', '.github/workflows/keeper-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: keeper-image
  cancel-in-progress: false
jobs:
  publish:
    # Runs only where the repository variable PUBLISH_IMAGES is 'true'; forks and copies publish nothing.
    if: vars.PUBLISH_IMAGES == 'true'
    # The Arc keeper hosts are linux/amd64; servers pull this image instead of compiling next to a live keeper.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: sh deploy/docker/keeper.sh init
      - run: sh deploy/docker/keeper.sh build
      - run: node scripts/keeper-docker-smoke.mjs
        env:
          EXPECTED_DOCKER_ARCH: amd64
      - name: Push the smoke-tested image by commit and record its digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/keeper"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag d20dao-keeper:local "$image:sha-$GITHUB_SHA"
          docker tag d20dao-keeper:local "$image:main"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:main"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:sha-$GITHUB_SHA")
          docker logout ghcr.io
          {
            echo "### Keeper image"
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Digest: \`$digest\`"
            echo "Deploy after checks pass: \`sh deploy/docker/keeper.sh update $digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
